name: publish prebuilts

# Commits the prebuilts that the builder jobs upload as artifacts. It runs on
# a GitHub-hosted runner so that the App private key never reaches the AOSP
# builder, which runs code from every synced project.
on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Pattern selecting the prebuilt artifacts to commit.
        required: true
        type: string
      paths:
        description: Space-separated paths the prebuilts may update.
        required: true
        type: string
    secrets:
      app-private-key:
        description: Private key of the riseproject-dev GitHub App.
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Updates from the kernel, Mesa and WebView workflows push to the same
    # branch.
    concurrency:
      group: publish-prebuilts
      cancel-in-progress: false
      queue: max
    env:
      BRANCH: android-17
      # Only the LFS files the prebuilts add are needed, not the others.
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - name: Download the prebuilts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: ${{ runner.temp }}/prebuilts
          merge-multiple: true

      # A builder job uploads nothing when its sources did not change.
      - name: Look for prebuilts
        id: found
        run: |
          if ls "$RUNNER_TEMP"/prebuilts/*/prebuilts.tar >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prebuilts to commit."
          fi

      - name: Get a riseproject-dev App token
        if: steps.found.outputs.found == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Check out device/rise
        if: steps.found.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false

      - name: Commit and push the prebuilts
        if: steps.found.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PATHS: ${{ inputs.paths }}
        run: |
          read -ra paths <<< "$PATHS"
          bash .github/scripts/commit-prebuilts.sh "$RUNNER_TEMP/prebuilts" "${paths[@]}"
